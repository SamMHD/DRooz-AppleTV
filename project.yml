name: DRooz
options:
  bundleIdPrefix: com.sammhd
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: fa
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
packages:
  DroozKit:
    path: Packages/DroozKit
targets:
  DRooz:
    type: application
    platform: tvOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: DroozKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DRooz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa]
        UIAppFonts:
          - vazirmatn_regular.ttf
          - vazirmatn_medium.ttf
          - vazirmatn_bold.ttf
          - vazirmatn_extrabold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  DRooz:
    build:
      targets:
        DRooz: all
    run:
      config: Debug
    archive:
      config: Release
