name: TestFlight

# Archives a Release build and uploads it to App Store Connect for internal TestFlight testing.
#
# Runs on every push to main (except docs-only changes), on tags like v1.2.3, and by hand
# (Actions → TestFlight → Run workflow). The version comes from the tag, the manual input, or
# MARKETING_VERSION in project.yml; the build number is minutes since 2026-01-01 UTC, so it only grows.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   Issuer ID shown above the team keys (leave unset for an individual key)
#   ASC_KEY_P8      Full text of the AuthKey_XXXX.p8 file
# Repository variables (optional): APPLE_TEAM_ID (default K3F46GZX35), BUNDLE_ID (default com.sammhd.drooz).
# Until the key secrets exist, pushes skip the upload and manual runs fail with a hint.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (empty = MARKETING_VERSION in project.yml)
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.sammhd.drooz' }}
      DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID || 'K3F46GZX35' }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$K" ] && [ -n "$P" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="ASC_KEY_ID / ASC_KEY_P8 secrets are not set, so nothing was uploaded (see README → Releasing)."
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
          echo "::notice::$msg"
          echo "Skipped: $msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - name: Select Xcode
        if: steps.secrets.outputs.ok == 'true'
        run: |
          X="$(printf "%s\n" /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$X" && xcodebuild -version

      - name: Install XcodeGen
        if: steps.secrets.outputs.ok == 'true'
        run: brew install xcodegen

      - name: Write API key
        if: steps.secrets.outputs.ok == 'true'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Versions
        if: steps.secrets.outputs.ok == 'true'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          [ -z "$V" ] && V="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)"
          [ -z "$V" ] && { echo "::error::No version found"; exit 1; }
          B=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "MARKETING_VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$B" >> "$GITHUB_ENV"
          echo "Version $V ($B)"

      - name: Generate project
        if: steps.secrets.outputs.ok == 'true'
        run: xcodegen generate

      - name: Archive
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild archive -project DRooz.xcodeproj -scheme DRooz -configuration Release \
            -destination 'generic/platform=tvOS' -archivePath "$RUNNER_TEMP/DRooz.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|\*\*" | head -200

      - name: Sign and upload to App Store Connect
        if: steps.secrets.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          PLIST
          # An individual (per-user) key has no issuer ID.
          ISSUER=()
          [ -n "$ISSUER_ID" ] && ISSUER=(-authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DRooz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" "${ISSUER[@]}" \
            2>&1 | grep -vE "^\s*$|Progress [0-9]+%: (Waiting|Uploading|Preparing|Requesting)" | tail -60

      - name: Summary
        if: steps.secrets.outputs.ok == 'true'
        run: |
          echo "### Uploaded DRooz $MARKETING_VERSION ($BUILD_NUMBER) to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Internal testers get it after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"
