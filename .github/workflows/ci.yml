name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-tests:
    name: DroozKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(printf "%s\n" /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)" && xcodebuild -version
      - name: swift test
        working-directory: Packages/DroozKit
        run: |
          set -o pipefail
          swift test 2>&1 | grep -vE "^\[[0-9]+/[0-9]+\]" | tail -150

  app-build:
    name: Build tvOS app
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.sammhd.drooz' }}
      DEVELOPMENT_TEAM: ""
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(printf "%s\n" /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project DRooz.xcodeproj -scheme DRooz -configuration Debug \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\*" | head -300
